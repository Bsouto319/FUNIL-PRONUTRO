name: Pronutro Poll Safety Net

on:
  schedule:
    # Reduzido pra economizar recurso — funil-pronutro é baixa prioridade (pouco uso,
    # sem receita). O pg_cron do proprio Supabase ja cobre a cada 15min; isso aqui
    # e so rede de seguranca extra, de vez em quando.
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Chama a função pronutro-poll
        run: |
          curl -sf -X POST "https://utbvjbltoycvczsfvouz.supabase.co/functions/v1/pronutro-poll" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
